name: NBA Analytics Dashboard Tests

on:
  push:
    paths:
      - "Projects/nba-analytics-dashboard/**"
      - ".github/workflows/nba-dashboard-tests.yml"
  pull_request:
    paths:
      - "Projects/nba-analytics-dashboard/**"
      - ".github/workflows/nba-dashboard-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projects/nba-analytics-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r files/requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
